name: Update Racing Alpha Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Racing Alpha feed
        run: |
          curl -L --fail --retry 3 \
            "https://icy-queen-0db8.fifetradinguk.workers.dev/" \
            -o racing-alpha.txt

      - name: Find today's AW agreements
        shell: python
        run: |
          import re
          import json
          import html
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("racing-alpha.txt", encoding="utf-8") as f:
              text = f.read()

          text = html.unescape(text)
          text = re.sub(r"\s+", " ", text).strip()

          now = datetime.now(ZoneInfo("Europe/London"))
          today = now.strftime("%d/%m/%Y")

          bookmakers = (
              r"Betfair Exchange|Betfair Sportsbook|"
              r"SmarketsSBK|Smarkets|Matchbook|Bet365|"
              r"Betfred|Paddy Power|William Hill|Ladbrokes|"
              r"Coral|Unibet|BetMGM|BetTom|10 Bet|"
              r"Hollywood Bets"
          )

          # Split at EVERY race date/time header.
          # This prevents one race from swallowing data
          # belonging to another race or another day.
          race_header = re.compile(
              r"(?=\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}\s+)"
          )

          rows = race_header.split(text)
          qualifiers = []

          for row in rows:
              # Only process rows belonging to today.
              if not re.match(
                  rf"^{re.escape(today)}\s+\d{{2}}:\d{{2}}\s+",
                  row
              ):
                  continue

              # Frozen rule requires All-Weather.
              if "(AW)" not in row:
                  continue

              # Only live/pending selections are relevant.
              if "pending" not in row:
                  continue

              header = re.match(
                  rf"{re.escape(today)}\s+"
                  r"(\d{2}:\d{2})\s+"
                  r"(.+?\(AW\))\s+"
                  r"Flat\b.*?\bStandard\b\s+",
                  row
              )

              if not header:
                  continue

              race_time = header.group(1)
              course = header.group(2).strip()

              body = row[header.end():]
              body = body.split(" pending", 1)[0]

              pick_re = re.compile(
                  rf"(.+?)\s+"
                  r"(\d+/\d+)\s*·\s*"
                  r"(\d+(?:\.\d+)?)\s+"
                  rf"({bookmakers})(?=\s|$)"
              )

              picks = list(pick_re.finditer(body))

              # Need both v1.0 and v1.1 selections.
              if len(picks) < 2:
                  continue

              v1 = picks[0]
              v11 = picks[1]

              horse1 = re.sub(
                  rf"^.*?(?:{bookmakers})\s+",
                  "",
                  v1.group(1)
              ).strip(" —")

              horse2 = re.sub(
                  rf"^.*?(?:{bookmakers})\s+",
                  "",
                  v11.group(1)
              ).strip(" —")

              # Frozen rule:
              # v1.0 and v1.1 must select the SAME horse.
              if horse1.casefold() != horse2.casefold():
                  continue

              qualifiers.append({
                  "time": race_time,
                  "course": course,
                  "horse": horse1,
                  "v1_fractional": v1.group(2),
                  "v1_decimal": float(v1.group(3)),
                  "v1_bookmaker": v1.group(4),
                  "v1_1_fractional": v11.group(2),
                  "v1_1_decimal": float(v11.group(3)),
                  "v1_1_bookmaker": v11.group(4)
              })

          output = {
              "date": now.strftime("%Y-%m-%d"),
              "rule": "AW + v1.0 and v1.1 same horse",
              "qualifiers": qualifiers,
              "source": "Racing Alpha head-to-head"
          }

          with open(
              "qualifiers.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print(json.dumps(output, indent=2))

      - name: Commit latest feed
        run: |
          git config user.name "racing-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add racing-alpha.txt qualifiers.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Racing Alpha feed"
          git push
