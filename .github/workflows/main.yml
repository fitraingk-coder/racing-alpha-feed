name: Update Racing Alpha Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Racing Alpha feed
        run: |
          curl -L --fail --retry 3 \
            "https://icy-queen-0db8.fifetradinguk.workers.dev/" \
            -o racing-alpha.txt

      - name: Find today's AW agreements
        shell: python
        run: |
          import re
          import json
          import html
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("racing-alpha.txt", encoding="utf-8") as f:
              text = f.read()

          # Convert HTML entities such as &#x27; back to characters.
          text = html.unescape(text)

          # Make the downloaded page one clean searchable string.
          text = re.sub(r"\s+", " ", text).strip()

          today = datetime.now(
              ZoneInfo("Europe/London")
          ).strftime("%d/%m/%Y")

          bookmakers = (
              r"Betfair Exchange|Betfair Sportsbook|"
              r"SmarketsSBK|Smarkets|Matchbook|Bet365|"
              r"Betfred|Paddy Power|William Hill|Ladbrokes|"
              r"Coral|Unibet|BetMGM|BetTom|10 Bet"
          )

          # Locate the beginning of every race row for today.
          row_start = re.compile(
              rf"(?={re.escape(today)}\s+\d{{2}}:\d{{2}}\s+)"
          )

          parts = row_start.split(text)

          qualifiers = []

          for row in parts:
              if not row.startswith(today):
                  continue

              # Experiment rule: all-weather races only.
              if "(AW)" not in row:
                  continue

              # We are interested in today's unsettled races.
              if "pending" not in row:
                  continue

              header = re.match(
                  rf"{re.escape(today)}\s+"
                  r"(\d{2}:\d{2})\s+"
                  r"(.+?AW)\s+"
                  r"Flat\b.*?\bStandard\b\s+",
                  row
              )

              if not header:
                  continue

              race_time = header.group(1)
              course = header.group(2).strip()

              body = row[header.end():]

              # Remove result/P&L material after the selections.
              body = body.split(" pending", 1)[0]

              # Selection format:
              # Horse 10/1 · 11.00 Matchbook
              pick_re = re.compile(
                  rf"(.+?)\s+"
                  r"(\d+/\d+)\s*·\s*"
                  r"(\d+(?:\.\d+)?)\s+"
                  rf"({bookmakers})(?=\s|$)"
              )

              picks = list(pick_re.finditer(body))

