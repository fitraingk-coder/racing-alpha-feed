name: Update Racing Alpha Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Racing Alpha feed
        run: |
          curl -L --fail --retry 3 \
            "https://icy-queen-0db8.fifetradinguk.workers.dev" \
            -o racing-alpha.txt

      - name: Commit latest feed
        run: |
          git config user.name "racing-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add racing-alpha.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update Racing Alpha feed"
          git push
